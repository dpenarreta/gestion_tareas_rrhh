# SQL Server de desarrollo para el nucleo de seguridad Django (backend/),
# adaptado de skelleton_base. No reemplaza la base PostgreSQL del Next.js
# legacy (prisma/): ambos motores conviven durante toda la migracion de
# stack (ver plan de Fase 1 en docs/). Uso: `docker compose up -d mssql`.
#
# NOTA: en la maquina de desarrollo del usuario, backend/.env apunta en
# cambio a una instancia de SQL Server ya existente y compartida entre
# varios proyectos (localhost:1433, base propia "gestion_tareas") — este
# servicio queda como alternativa autocontenida (puerto propio via
# DB_PORT) para quien no tenga esa instancia compartida disponible.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?la variable DB_PASSWORD es obligatoria}
      MSSQL_PID: Developer
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mssql_data:
